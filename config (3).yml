# Cooldown w sekundach po wybraniu itemu (3 godziny = 10800)
cooldown-seconds: 10800

# Gracz odradza sie od razu, bez ekranu smierci
immediate-respawn: true
# Minimalna liczba serc: gracz na 1 sercu, ktory zginie, odradza sie dalej z 1 sercem
min-hearts: 1

# Kowadlo: koszt nalozenia ksiegi (poziomy xp)
anvil-cost: 5
# Zeszyt: czas odnowienia w sekundach
zeszyt-cooldown-seconds: 90

# Pszczeli Roj
pszczeli-roj:
  bee-name: "<yellow>[Pszczoła roju]"   # nazwa nad kazda pszczola (jasnozolta)
  cooldown-seconds: 120
  bees: 8
  poison-seconds: 15
  poison-level: 2
  nausea-seconds: 10
  nausea-level: 2
  health-percent: 0.10   # 10% aktualnego zdrowia

# Luk Kupidyna
kupidyn:
  cooldown-seconds: 90

# Antyperla
antyperla:
  cooldown-seconds: 30
  block-seconds: 20

# Pradawna Laska
pradawna-laska:
  cooldown-seconds: 30
  range: 15
  slowness-seconds: 6
  slowness-level: 4
# Lakomczuch: szansa na odnowienie glodu podczas walki (0.20 = 20%)
lakomczuch-chance: 0.20

# Kusza z pulapka pajeczyn
pajecza-kusza:
  cooldown-seconds: 120  # 2 minuty
  duration-seconds: 10   # po tylu sekundach pajeczyny znikaja
  legs-height: 0.75      # trafienie ponizej tej wysokosci (w blokach od stop) = spodnie/buty, powyzej = tors/glowa

# Leki Dziadka
leki-dziadka:
  cooldown-seconds: 60
  negative-effects: [poison, wither, slowness, mining_fatigue, nausea, blindness, hunger, weakness, levitation, darkness, unluck, bad_omen, infested, oozing, weaving, raid_omen, trial_omen]

# Kieszen Zlodzieja
kieszen:
  title: "Kieszeń Złodzieja"
  drop-when-full: true   # brak miejsca w ekwipunku = przedmiot wypada na ziemię (false = zostaje w kieszeni)
  button-name: "<green>Wypłać przedmioty"
  button-lore: "<gray>Kliknij przedmiot, aby wypłacić tylko jego"

# Zwierzaki
pets:
  star-chance: 0.03          # szansa, ze naturalnie zrespiony mob dostanie gwiazdke
  star-name: "<yellow>⭐"
  star-mobs:
    - ZOMBIE
    - CREEPER
    - SPIDER
    - SKELETON
    - BAT
    - SHEEP
    - COW
    - PIG
    - CHICKEN
    - SQUID
    - DROWNED
    - BEE
    - HORSE
    - WOLF
    - FOX
    - CAT
    - DOLPHIN
    - HUSK
    - STRAY
    - SLIME
    - WITCH
    - TURTLE
    - PILLAGER
    - IRON_GOLEM
    - POLAR_BEAR
    - PARROT
    - OCELOT
    - AXOLOTL
    - PANDA
    - GUARDIAN
    - CAVE_SPIDER
    - SILVERFISH
    - ZOMBIE_VILLAGER
    - MULE
  consume-cage-on-fail: true # czy klatka znika, gdy zlapanie sie nie uda
  # Zwykla klatka: szansa zalezy od rangi. Dopisz uprawnienia rang, najwyzsza pasujaca szansa wygrywa, np.:
  # rank-chances:
  #   - permission: "twoj.plugin.ranga.vip"
  #     chance: 60
  rank-chances: []
  skew: 3.0                  # im wiecej, tym rzadsze wysokie wartosci efektow
  pet-name: "<green><bold>Klatka z zwierzakiem"
  pet-material: ""            # puste = jajo moba; np. SPAWNER, zeby kazdy zwierzak mial ten sam wyglad
  poison-seconds: 5           # dlugosc zatrucia z efektu "Szansa na zatrucie"
  # Glowki zwierzakow: wpisz wartosc tekstury (pole "Value" z minecraft-heads.com) dla danego moba, np.
  # heads:
  #   PIG: "eyJ0ZXh0dXJlcyI6..."
  # Bez wpisu zwierzak jest jajem moba (zombie, szkielet i creeper maja zwykle glowy).
  heads: {}
  # Krzywa rzadkosci wartosci efektow (poziomy rzadki-mityczny). f = ulamek zakresu poziomu, chance = % szans,
  # ze wylosowana wartosc bedzie co najmniej taka. Przyklad mitycznego (zakres 1-51): >=30% to ok. 10%, >=44% to ok. 0,5%.
  value-curve:
    - {f: 0.15, chance: 70}
    - {f: 0.35, chance: 35}
    - {f: 0.55, chance: 14}
    - {f: 0.85, chance: 0.5}
    - {f: 1.0, chance: 0.05}
  effects:
    damage-reduction: "Redukcja Obrazen"
    dripstone-reduction: "Redukcja Obrazen od Dripa"
    avg-damage: "Srednie Obrazenia"
    crit-damage: "Obrazenia Krytyczne"
    fall-reduction: "Redukcja Obrazen od Upadku"
    crit-chance: "Szansa na Kryta"
    poison-chance: "Szansa na zatrucie"
  color-red-below: 10         # wartosc ponizej (takze ujemna) = czerwony
  color-gold-below: 25        # ponizej = zloty, od tej wartosci = jasnoniebieski
  tiers:
    zwykly:
      weight: 40
      name: "<green>Zwykły"
      effects: 2
      best-chance: 0
      uniform: true            # rownomiernie (bez krzywej), zeby ujemne wartosci tez sie zdarzaly
      range: [-15, 5]          # zwykly zwierzak moze miec ujemne efekty
      best-range:
        avg-damage: [-15, 5]
        damage-reduction: [-15, 5]
    rzadki:
      weight: 40
      name: "<gray>Rzadki"
      effects: 2
      best-chance: 0.5
      range: [1, 5]
      best-range:
        avg-damage: [1, 10]
        damage-reduction: [1, 10]
    bardzo_rzadki:
      weight: 30
      name: "<aqua>Bardzo rzadki"
      effects: 2
      best-chance: 1
      range: [1, 8]
      best-range:
        avg-damage: [1, 15]
        damage-reduction: [1, 15]
    epicki:
      weight: 20
      name: "<dark_purple>Epicki"
      effects: 3
      best-chance: 5
      range: [1, 12]
      best-range:
        avg-damage: [1, 30]
        damage-reduction: [1, 25]
    mityczny:
      weight: 10
      name: "<red>Mityczny"
      effects: 4
      best-chance: 100
      range: [1, 20]
      best-range:
        avg-damage: [1, 51]
        damage-reduction: [1, 49]

# Scoreboard po prawej stronie ekranu
scoreboard:
  enabled: true
  title: "<blue><bold>LIFESTEAL SMP"
  update-ticks: 20          # co ile ticków odświeżać (20 = 1 sekunda)
  ranking-start: 500          # ranking na start
  # Zabojstwo daje: ranking-kill-base * scale / (scale + TWOJ_RANKING), czyli im wyzszy ranking, tym mniej punktow
  ranking-kill-base: 50
  ranking-kill-scale: 1000
  # Smierc zabiera ranking-death-percent % rankingu (minimum ranking-death-min), czyli im wyzszy ranking, tym wiecej traci
  ranking-death-percent: 5
  ranking-death-min: 5
  # Skad brac sektor, klan i pieniadze. Wpisz stala wartosc albo placeholder PlaceholderAPI,
  # np. "%vault_eco_balance_formatted%". Bez PlaceholderAPI pokaze sie dokladnie ten tekst.
  sources:
    sector: "spawn_1"
    clan: "brak"
    money: "0$"
  # Tagi: <nick> <kills> <deaths> <ranking> <hearts> <sector> <clan> <money>
  lines:
    - "<red>★ <white>Sektor: <red><sector>"
    - "<yellow>✎ <white>Nick: <yellow><nick>"
    - "<aqua>⚑ <white>Klan: <aqua><clan>"
    - "<gold>⚔ <white>KD: <aqua><kills> ⚔ <gray>| <white><deaths> <red>☠"
    - "<light_purple>⚡ <white>Ranking: <light_purple><ranking>"
    - "<green>$ <white>Pieniądze: <green><money>"
    - "<red>♥ <white>Serca: <dark_red><hearts>♥"
    - ""
    - "<white>Strona: <blue>SelectItemy"
    - "<white>Discord: <blue>SelectItemy"

# Mityczna zmiana (papier otwierajacy GUI zmiany efektow zwierzaka)
mityczna-zmiana:
  title: "Mityczna zmiana"
  button-name: "<green>Zmień efekty"
  button-lore: "<gray>Zużywa jedną mityczną zmianę"

# Zakreslacz
zakreslacz:
  cooldown-seconds: 180      # czas odnowienia PPM (usuwanie pozytywnych efektow)
  mark-seconds: 15           # tyle sekund widzisz odleglosc uderzonego przeciwnika na Action Barze
  glowing-seconds: 5         # Glowing po uderzeniu (bez druzyny swieci na bialo)
  actionbar: "<red><name> <white>- <yellow><distance> kratek"
  positive-effects: [speed, haste, strength, instant_health, jump_boost, regeneration, resistance, fire_resistance, water_breathing, invisibility, health_boost, absorption, saturation, night_vision, luck, slow_falling, conduit_power, dolphins_grace, hero_of_the_village]

